canonifyURLs = false
relativeURLs = false
baseURL = "/"
title = "MESH|Lab"
theme = "hugoplate"
timeZone = "Europe/Oslo"
# post excerpt
summaryLength = 10 # see https://gohugo.io/content-management/summaries/#automatic-summary
hasCJKLanguage = false
languageCode = 'en-us'

[services]
[services.googleAnalytics]
ID = ''

[permalinks.page]
"pages" = "/:slugorcontentbasename/"


[pagination]
disableAliases = false
pagerSize = 10
path = 'page'


[build]
[build.buildStats]
enable = true
[[build.cachebusters]]
source = 'assets/notwatching/hugo_stats\.json'
target = 'css'

[module]
[[module.mounts]]
source = 'assets'
target = 'assets'
[[module.mounts]]
source = 'static'
target = 'static'
[[module.mounts]]
disableWatch = true
source = 'hugo_stats.json'
target = 'assets/notwatching/hugo_stats.json'


[outputs]
home = ["HTML", "RSS", "WebAppManifest", "SearchIndex"]

[imaging]
# See https://github.com/disintegration/imaging
# Default JPEG or WebP quality setting. Default is 75.
quality = 80
resampleFilter = "Lanczos"

[caches]
[caches.images]
dir = ":resourceDir/_gen"
maxAge = "720h"

[caches.assets]
dir = ":resourceDir/_gen"
maxAge = "720h"


[markup]
[markup.goldmark.renderer]
unsafe = true

[markup.highlight]
style = 'monokai' # see https://xyproto.github.io/splash/docs/all.html
lineNumbersInTable = false

[markup.tableOfContents]
startLevel = 2
endLevel = 5
ordered = true


[mediaTypes]
[mediaTypes."application/manifest+json"]
suffixes = ["webmanifest"]


[outputFormats]
[outputFormats.WebAppManifest]
mediaType = "application/manifest+json"
rel = "manifest"

[outputFormats.SearchIndex]
mediaType = "application/json"
baseName = "searchindex"
isPlainText = true
notAlternative = true


# CSS plugins — kept minimal; font-awesome dropped (replaced by inline SVG).
[[params.plugins.css]]
link = "plugins/swiper/swiper-bundle.css"
lazy = true

# JS plugins — kept what we actually use (search, swiper, accordion/tab/modal
# shortcodes for Markdown content). Dropped cookie-consent (no cookies),
# glightbox / gallery-slider.js (no galleries), youtube-lite (no embeds yet).
[[params.plugins.js]]
link = "js/search.js"
lazy = false
[[params.plugins.js]]
link = "plugins/swiper/swiper-bundle.js"
lazy = false
[[params.plugins.js]]
link = "js/accordion.js"
lazy = true
[[params.plugins.js]]
link = "js/tab.js"
lazy = true
[[params.plugins.js]]
link = "js/modal.js"
lazy = true
