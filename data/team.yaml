## MESH|Lab team roster.
##
## Source of truth for the /team/ page. Edit this file; the page picks
## up changes on the next Hugo rebuild. Order within each tier follows
## "weight" ascending.
##
## Tiers (matches the formal group description, 2026-05-20 PDF):
##   head            — the head of the group, "Group Leader" (one entry)
##   group           — "Group Member" tier (core lab members)
##   students        — MSc students doing project work in the lab
##   associate       — "Associated Member" tier; role: technical | clinical
##   visiting        — visiting researchers / external students, time-bounded
##   alumni          — past members, compact name + period rendering
##
## Each entry's fields (use empty strings for what you don't want shown):
##   slug              short identifier (used as DOM id for the modal)
##   name              display name
##   role              tier-specific: for associates → technical | clinical
##                                   for visiting → home institution name
##                                   for alumni  → past role
##   specialty         (associates only) short label rendered in the
##                     card chip — e.g. "Consultant Surgeon", "Systems
##                     Engineer". If empty, the chip falls back to
##                     "Clinical" / "Technical". Color of the chip is
##                     always driven by `role`: clinical → sage,
##                     technical → amber.
##   affiliation       short institutional line
##   photo             /images/team/<slug>.jpg (drop in static/images/team/)
##   bio_short         one-sentence card subtitle
##   bio               multi-line HTML for the modal body
##   expertise         array of short tags
##   projects          array of {slug, title} for current projects (slug links to /projects/<slug>/)
##   orcid             ORCID id (no URL, just the id, e.g. "0000-0003-1234-5678")
##   github            GitHub handle
##   scholar           Google Scholar profile URL
##   email             public email if any (omit otherwise)
##   period            for visiting / alumni only — e.g. "2024", "2022-2024"
##   weight            sort order within tier (lower = first)

head:
  - slug: rafael-palomar
    name: Rafael Palomar
    role: Group Leader · Assoc. Prof. (PhD)
    affiliation: The Intervention Centre, Oslo University Hospital · NTNU
    photo: /images/team/rafael-palomar.jpg
    bio_short: Translating clinical needs into precision-medicine software.
    bio: |
      <p>Rafael Palomar leads MESH|Lab at the Intervention Centre,
      Oslo University Hospital. His work spans image-guided surgery,
      soft-tissue simulation, reproducible operating systems for
      medical computing, and the long-term maintenance of open-source
      clinical software.</p>
      <p>He is the lead maintainer of SystoleOS, SlicerLiver,
      SlicerSOFA, and the Brainlab/SystoleOS navigation bridge.
      Externally he collaborates with Brigham and Women's Hospital,
      Inria, Karlsruhe Institute of Technology, the Paris Brain
      Institute, and Queen's University, and serves on European
      project consortia in stereotactic neurosurgery and clinical AI.</p>
    expertise:
      - Image-guided surgery
      - Soft-tissue simulation
      - Medical-software reproducibility
      - Clinical-software regulation
    projects:
      - slug: systoleos
        title: SystoleOS
      - slug: slicerliver
        title: SlicerLiver
      - slug: slicersofa
        title: SlicerSOFA
    github: rafaelpalomar
    email: rafael.palomar@ous-research.no
    weight: 1

