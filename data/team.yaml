      <p>Jonas wrote his MSc thesis on a deep reinforcement learning
      approach to neurosurgical trajectory planning, framing the problem
      as a sequential decision task over medical imaging and vascular
      models. The work was done at the KIT Institute of Biomedical
      Engineering in cooperation with The Intervention Centre, and
      completed in 2026.</p>
    expertise:
