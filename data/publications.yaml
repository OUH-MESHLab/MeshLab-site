## MESH|Lab selected publications.
##
## Source of truth for the /publications/ page and the home-page
## "selected publications" block. Edit this file; the site picks up
## changes on the next Hugo rebuild.
##
## Fields:
##   slug         short identifier (used for the doi/permalink anchor)
##   title        full paper title
##   authors      author array as listed on the paper; mark MESH|Lab
##                authors by wrapping with **double asterisks** so the
##                layout can bold them (markdown-style)
##   venue        full journal / conference name
##   year         publication year (integer)
##   type         journal | conference | preprint | book-chapter | thesis
##   doi          DOI string (no URL prefix) — empty if pre-print only
##   url_pdf      direct PDF URL (open access where possible)
##   url_code     companion code/data URL (often a GitHub repo)
##   themes       research-theme slugs (see /research/) for filter chips
##   weight       sort within year; lower = earlier in list

