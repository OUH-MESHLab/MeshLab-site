#################### default parameters ############################
# Logo
favicon = "images/favicon.png"
logo = "images/logo.svg"
logo_darkmode = ""
logo_width = ""
logo_height = "32px"
logo_webp = false
# logo text shows when logo image is missing
logo_text = "MESH|Lab"
# navbar fixed to top
navbar_fixed = true
# theme-mode (DESIGN.md is single-canvas; toggle disabled)
theme_switcher = false
theme_default = "light"
# Main Sections
mainSections = ["news", "blog"]
# contact form action — unused; contact is email-only for now
contact_form_action = "#"
# analytics
google_tag_manager = ""
google_adsense = ""
custom_script = ""
# copyright (rendered in footer)
copyright = "© MESH|Lab — Oslo University Hospital"

# Preloader
# preloader module: https://github.com/gethugothemes/hugo-modules/tree/master/components/preloader
[preloader]
enable = false
preloader = "" # use jpg, png, svg or gif format.

# Navigation button (header-right CTA)
[navigation_button]
enable = true
label = "Contact"
link = "contact"

# search (full-site search)
[search]
enable = true
primary_color = "#B85C00"
include_sections = ["news", "blog", "projects", "research"]
show_image = false
show_description = true
show_tags = true
show_categories = true

# announcement banner (off — no marketing announcements on a lab site)
[announcement]
enable = false
expire_days = 7
content = ""

# OpenGraph / Twitter Card defaults
[metadata]
keywords = ["medical software", "image-guided surgery", "Oslo University Hospital", "3D Slicer", "precision medicine"]
description = "MESH|Lab — medical-software research at Oslo University Hospital. Operating systems, surgical navigation, simulation, and clinical AI."
author = "MESH|Lab"
twitter = ""
image = "images/og-image.png"


# site verifications
# verification module: https://github.com/gethugothemes/hugo-modules/tree/master/seo-tools/site-verifications
[site_verification]
google = ""   # Your verification code
bing = ""     # Your verification code
baidu = ""    # Your verification code
facebook = "" # Your verification code
mastodon = "" # Your verification code

# cookies
# cookies module: https://github.com/gethugothemes/hugo-modules/tree/master/components/cookie-consent
[cookies]
enable = false
expire_days = 60
content = "This site uses cookies. By continuing to use this website, you agree to their use."
button = "I Accept"

# diagrams
[mermaid]
js_url = 'https://cdn.jsdelivr.net/npm/mermaid@latest/dist/mermaid.esm.min.mjs'

######################## sidebar widgets #########################
[widgets]
sidebar = ["categories", "tags"]


# google map
[google_map]
enable = false
map_api_key = "AIzaSyCcABaamniA6OL5YvYSpB3pFMNrXwXnLwU"
map_latitude = "51.5223477"
map_longitude = "-0.1622023"
map_marker = "images/marker.png"


# Subscription
[subscription]
enable = false
# mailchimp subsciption
mailchimp_form_action = "https://gmail.us4.list-manage.com/subscribe/post?u=463ee871f45d2d93748e77cad&amp;id=a0a2c6d074" # replace this url with yours
mailchimp_form_name = "b_463ee871f45d2d93748e77cad_a0a2c6d074"
